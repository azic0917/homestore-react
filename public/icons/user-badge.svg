<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="userBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E65" />
      <stop offset="100%" stop-color="#36224A" />
    </linearGradient>

    <linearGradient id="userGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="100%" stop-color="#E8D3A7" />
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2D4EE" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#userBadgeBg)" stroke="#4A2E65" stroke-width="2" />
  
  <!-- Dashed Inner Gold Ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#userGoldAccent)" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- USER AVATAR ICON -->
  <!-- Head -->
  <circle cx="50" cy="38" r="14" fill="url(#avatarGrad)" />

  <!-- Body / Shoulders -->
  <path d="M 26 74 C 26 58, 36 54, 50 54 C 64 54, 74 58, 74 74 C 74 77, 71 80, 67 80 L 33 80 C 29 80, 26 77, 26 74 Z" fill="url(#avatarGrad)" />

  <!-- Verified Crown / Star Badge Emblem at Bottom Right -->
  <circle cx="71" cy="71" r="11" fill="url(#userBadgeBg)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="71" cy="71" r="9" fill="url(#userGoldAccent)" />
  
  <!-- Checkmark -->
  <path d="M66.5 71 L69.5 74 L75.5 67.5" fill="none" stroke="#4A2E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
