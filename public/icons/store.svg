<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E65" />
      <stop offset="100%" stop-color="#36224A" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="100%" stop-color="#E8D3A7" />
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F0F8" />
    </linearGradient>
  </defs>

  <!-- Circular Badge Outline -->
  <circle cx="50" cy="50" r="46" fill="#F8F6FC" stroke="url(#roofGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- STORE BUILDING SHAPE -->
  <!-- Building Base / Main Structure -->
  <rect x="22" y="44" width="56" height="36" rx="4" fill="url(#wallGrad)" stroke="#4A2E65" stroke-width="2.5" />

  <!-- Glass Display Window -->
  <rect x="28" y="52" width="18" height="20" rx="2" fill="#E2D4EE" stroke="#4A2E65" stroke-width="1.5" />
  <line x1="28" y1="62" x2="46" y2="62" stroke="#FFFFFF" stroke-width="1.5" />
  <line x1="37" y1="52" x2="37" y2="72" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Store Front Door -->
  <rect x="54" y="52" width="16" height="28" rx="2" fill="#4A2E65" />
  <circle cx="57" cy="66" r="1.5" fill="url(#accentGrad)" />

  <!-- Awnings / Canopy Roof Scallops (Striped Purple & Gold) -->
  <!-- Roof Base -->
  <path d="M18 36 L82 36 L78 46 L22 46 Z" fill="url(#roofGrad)" stroke="#4A2E65" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Awning Stripes (Gold Accents) -->
  <path d="M28 36 L34 36 L32 46 L26 46 Z" fill="url(#accentGrad)" />
  <path d="M42 36 L48 36 L46 46 L40 46 Z" fill="url(#accentGrad)" />
  <path d="M56 36 L62 36 L60 46 L54 46 Z" fill="url(#accentGrad)" />
  <path d="M70 36 L76 36 L74 46 L68 46 Z" fill="url(#accentGrad)" />

  <!-- Roof Top Sign Header -->
  <path d="M30 26 C30 23, 70 23, 70 26 L74 36 L26 36 Z" fill="url(#roofGrad)" stroke="#4A2E65" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Star Emblem on Signboard -->
  <polygon points="50,26 51.8,29.6 55.8,30.2 52.9,33 53.6,37 50,35.1 46.4,37 47.1,33 44.2,30.2 48.2,29.6" fill="url(#accentGrad)" />
</svg>
