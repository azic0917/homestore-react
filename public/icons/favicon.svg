<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Purple to Indigo Gradient -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="50%" stop-color="#5C3B88" />
      <stop offset="100%" stop-color="#3B5998" />
    </linearGradient>
  </defs>

  <!-- Bright Background Badge for Dark Mode Visibility -->
  <circle cx="150" cy="150" r="130" fill="#FFFFFF" />

  <!-- Shopping Cart Icon -->
  <g fill="url(#purpleGradient)">
    <!-- Cart Handle & Frame -->
    <path d="M 60,85 C 60,77 68,75 75,75 L 90,75 C 100,75 105,82 108,90 L 130,155 C 132,161 138,165 145,165 L 205,165 C 212,165 218,161 220,155 L 235,110 C 237,103 232,95 224,95 L 115,95" 
          fill="none" 
          stroke="url(#purpleGradient)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Basket Lines -->
    <line x1="122" y1="117" x2="228" y2="117" stroke="url(#purpleGradient)" stroke-width="10" stroke-linecap="round" />
    <line x1="130" y1="139" x2="218" y2="139" stroke="url(#purpleGradient)" stroke-width="10" stroke-linecap="round" />

    <!-- Cart Wheels -->
    <circle cx="140" cy="190" r="14" />
    <circle cx="205" cy="190" r="14" />
  </g>
</svg>
