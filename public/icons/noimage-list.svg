<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Brand Color Palette Gradients -->
    <linearGradient id="textPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E65" />
      <stop offset="100%" stop-color="#36224A" />
    </linearGradient>

    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="50%" stop-color="#E8D3A7" />
      <stop offset="100%" stop-color="#CBB281" />
    </linearGradient>

    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6FC" />
      <stop offset="100%" stop-color="#EADDF4" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A2E65" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- CENTERED SEARCH ICON EMBLEM WITH CLEAN SAD EMOJI LENS -->
  <g transform="translate(40, 40)" filter="url(#iconShadow)">
    <!-- Outer Background Circle -->
    <circle cx="40" cy="40" r="36" fill="url(#iconBgGrad)" stroke="#E2D4EE" stroke-width="1.5" />
    
    <!-- Dashed Inner Gold Accent Ring -->
    <circle cx="40" cy="40" r="31" fill="none" stroke="url(#textGoldGrad)" stroke-width="1.2" stroke-dasharray="3 2" />

    <!-- Magnifying Glass Lens Frame -->
    <circle cx="34" cy="34" r="16" fill="none" stroke="url(#textPurpleGrad)" stroke-width="3" />
    
    <!-- Magnifying Glass Handle -->
    <path d="M 45 45 L 57 57" stroke="url(#textPurpleGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 45 45 L 57 57" stroke="url(#textGoldGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- CLEAN SAD EMOJI INSIDE LENS -->
    <!-- Sad Eyes -->
    <ellipse cx="28.5" cy="31" rx="1.5" ry="2.2" fill="#4A2E65" />
    <ellipse cx="39.5" cy="31" rx="1.5" ry="2.2" fill="#4A2E65" />
    
    <!-- Sad Mouth (Frown Arch) -->
    <path d="M 27.5 41 Q 34 35 40.5 41" stroke="#4A2E65" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
